<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartWay AVM — Kiosk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0c0a08; overflow: hidden; font-family: 'Sora', sans-serif; }
  #pairScreen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f6f3ec; gap: 18px; }
  #pairScreen input { font-size: 28px; padding: 14px 22px; border-radius: 12px; border: none; text-align: center; letter-spacing: 4px; width: 260px; text-transform: uppercase; }
  #pairScreen button { font-size: 16px; padding: 12px 26px; border-radius: 100px; border: none; background: #C79A3E; color: #1a1207; font-weight: 700; cursor: pointer; }
  #pairScreen p { opacity: .6; font-size: 13px; }
  #stage { position: fixed; inset: 0; display: none; background: #000; }
  #stage img, #stage video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
  #stage img.active, #stage video.active { opacity: 1; }
  #deviceLabel { position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.35); font-size: 12px; font-family: sans-serif; z-index: 10; }
  #errorBanner { position: fixed; top: 0; left: 0; right: 0; background: #B4432E; color: #fff; text-align: center; padding: 10px; font-size: 13px; display: none; z-index: 20; }
</style>
</head>
<body>

<div id="pairScreen">
  <div style="font-size:40px;font-weight:600;">SW</div>
  <h1 style="font-weight:400;font-size:22px;">Ekranı Eşleştir</h1>
  <input id="pairInput" maxlength="6" placeholder="KOD" />
  <button id="pairBtn">Bağlan</button>
  <p>AVM Yönetim Paneli → Signage bölümünden alınan 6 haneli kod.</p>
</div>

<div id="errorBanner"></div>
<div id="stage"></div>
<div id="deviceLabel"></div>

<script>
'use strict';
const stage = document.getElementById('stage');
const errorBanner = document.getElementById('errorBanner');
let pairingCode = localStorage.getItem('sw_kiosk_pairing_code');
let items = [];
let idx = 0;
let timer = null;

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.style.display = 'block';
  setTimeout(() => errorBanner.style.display = 'none', 4000);
}

async function fetchPlaylist() {
  try {
    const res = await fetch(`/api/signage/${pairingCode}/playlist`);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || 'Cihaz bulunamadı.');
    }
    const data = await res.json();
    document.getElementById('deviceLabel').textContent = `${data.device.mallName} · ${data.device.name}`;
    if (JSON.stringify(data.items) !== JSON.stringify(items)) {
      items = data.items;
      idx = 0;
      renderStage();
    }
  } catch (err) {
    showError(err.message);
    if (err.message.includes('bulunamadı')) {
      localStorage.removeItem('sw_kiosk_pairing_code');
      document.getElementById('pairScreen').style.display = 'flex';
      stage.style.display = 'none';
    }
  }
}

function renderStage() {
  clearTimeout(timer);
  stage.innerHTML = '';
  if (!items.length) {
    stage.innerHTML = '<div style="color:#666;display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif">İçerik bekleniyor…</div>';
    timer = setTimeout(fetchPlaylist, 8000);
    return;
  }
  const item = items[idx % items.length];
  const el = item.media.type === 'video' ? document.createElement('video') : document.createElement('img');
  el.src = item.media.url;
  if (item.media.type === 'video') { el.muted = true; el.autoplay = true; el.loop = false; }
  stage.appendChild(el);
  requestAnimationFrame(() => el.classList.add('active'));

  timer = setTimeout(() => { idx++; renderStage(); }, (item.durationSeconds || 10) * 1000);
}

document.getElementById('pairBtn').addEventListener('click', () => {
  const code = document.getElementById('pairInput').value.trim().toUpperCase();
  if (!code) return;
  pairingCode = code;
  localStorage.setItem('sw_kiosk_pairing_code', code);
  document.getElementById('pairScreen').style.display = 'none';
  stage.style.display = 'block';
  fetchPlaylist();
  setInterval(fetchPlaylist, 60000); // playlist içerik değişikliklerini dakikada bir kontrol et
});

if (pairingCode) {
  document.getElementById('pairScreen').style.display = 'none';
  stage.style.display = 'block';
  fetchPlaylist();
  setInterval(fetchPlaylist, 60000);
}

// Tam ekran (dokunmatik kiosk cihazlarında ilk dokunuşta)
document.body.addEventListener('click', () => {
  if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}, { once: true });
</script>
</body>
</html>
