<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartWay AVM — Parola Sıfırlama</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="mark">SW</div>

    <!-- ADIM 1: e-posta ile sıfırlama isteği (token URL'de yoksa gösterilir) -->
    <div id="requestStep">
      <h1>Parolamı Unuttum</h1>
      <p class="sub">E-posta adresinizi girin, size bir sıfırlama bağlantısı gönderelim.</p>
      <div id="requestError" class="login-error" hidden></div>
      <div id="requestSuccess" class="login-success" hidden></div>
      <form id="requestForm">
        <div class="field"><label>E-posta</label><input type="email" id="requestEmail" required /></div>
        <button class="btn btn--primary btn--block" type="submit">Sıfırlama Bağlantısı Gönder</button>
      </form>
    </div>

    <!-- ADIM 2: token URL'de varsa (e-postadaki bağlantıya tıklandığında) gösterilir -->
    <div id="resetStep" hidden>
      <h1>Yeni Parola Belirle</h1>
      <p class="sub">Hesabınız için yeni bir parola girin (en az 8 karakter).</p>
      <div id="resetError" class="login-error" hidden></div>
      <div id="resetSuccess" class="login-success" hidden></div>
      <form id="resetForm">
        <div class="field"><label>Yeni Parola</label><input type="password" id="newPassword" minlength="8" required /></div>
        <div class="field"><label>Yeni Parola (Tekrar)</label><input type="password" id="newPasswordConfirm" minlength="8" required /></div>
        <button class="btn btn--primary btn--block" type="submit">Parolayı Güncelle</button>
      </form>
    </div>

    <a class="login-forgot" href="/admin/mall-admin.html">← Girişe dön</a>
  </div>
</div>

<script src="/admin/js/reset-password.js"></script>
</body>
</html>
