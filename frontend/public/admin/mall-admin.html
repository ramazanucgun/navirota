<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartWay AVM — Yönetim Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="mark">SW</div>
    <h1>AVM Yönetim Paneli</h1>
    <p class="sub">Kat planı, kampanya, reklam ve analitiklerinizi yönetin.</p>
    <div id="loginError" class="login-error" hidden></div>
    <form id="loginForm">
      <div class="field"><label>E-posta</label><input type="email" id="loginEmail" required /></div>
      <div class="field"><label>Şifre</label><input type="password" id="loginPassword" required /></div>
      <button class="btn btn--primary btn--block" type="submit">Giriş Yap</button>
    </form>
    <div class="demo-hint">Demo: <strong>admin@terrace-avm.com</strong> / <strong>MallAdmin123!</strong></div>
  </div>
</div>

<!-- ANA PANEL -->
<div id="shell" class="shell" hidden>
  <aside class="sidebar">
    <div class="sidebar__brand"><div class="mark">SW</div><span class="sidebar__brand-text">SmartWay AVM</span></div>
    <div class="sidebar__mall" id="mallLabel">—</div>
    <nav class="nav-group" id="navGroup">
      <div class="nav-item active" data-view="overview">📊 Genel Bakış</div>
      <div class="nav-item" data-view="floors">🗺️ Katlar &amp; QR</div>
      <div class="nav-item" data-view="stores">🏬 Mağazalar</div>
      <div class="nav-item" data-view="campaigns">🏷️ Kampanyalar</div>
      <div class="nav-item" data-view="ads">📢 Reklamlar</div>
      <div class="nav-item" data-view="popups">📣 Duyurular</div>
      <div class="nav-item" data-view="users">👥 Kullanıcılar</div>
      <div class="nav-item" data-view="signage">📺 Signage</div>
      <div class="nav-item" data-view="integrations">🔌 Entegrasyonlar</div>
      <div class="nav-item" data-view="support">🛟 Destek</div>
    </nav>
    <div class="sidebar__footer">
      <div class="sidebar__user" id="userLabel">—</div>
      <button class="btn btn--ghost sidebar__logout" id="logoutBtn" style="color:#f6f3ec;border-color:rgba(255,255,255,0.18)">Çıkış Yap</button>
    </div>
  </aside>
  <main class="content" id="content"></main>
</div>

<script src="/admin/js/authClient.js"></script>
<script src="/admin/js/mall-admin.js"></script>
</body>
</html>
